# Cloud Build pipeline for talimio-backend.
#
# Low-abstraction flow:
# 1) Build image
# 2) Push image
# 3) Deploy + execute Cloud Run Neon rehearsal job
# 4) Deploy + execute Cloud Run migrator job
# 5) Deploy the jobs worker pool (same image, runs the procrastinate worker)
# 6) Deploy service with schema-validation startup
#
# Assumption: runtime env/secrets are managed on Cloud Run resources.

steps:
  # 1. Build the backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'
      - 'backend'

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'

  # 3. Deploy and run Cloud Run Neon rehearsal job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'backend-neon-rehearsal'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'
      - '--command=uv'
      - '--args=run,--no-dev,python,-m,src.database.migrate_rehearsal'
      - '--execute-now'
      - '--wait'
      - '--region=us-west1'
      - '--quiet'

  # 4. Deploy and run Cloud Run migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'backend-migrator'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'
      - '--command=uv'
      - '--args=run,--no-dev,python,-m,src.database.migrate'
      - '--execute-now'
      - '--wait'
      - '--region=us-west1'
      - '--quiet'

  # 5. Deploy the procrastinate worker as an always-on worker pool (no URL).
  #    Same image as the service; `python -m` puts /app on sys.path like the migrator.
  #    Like the service, env/secrets live on the resource: bootstrap the pool once with
  #    the service's --set-env-vars/--set-secrets, and these deploys only swap the image.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'worker-pools'
      - 'deploy'
      - 'talimio-worker'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'
      - '--command=uv'
      - '--args=run,--no-dev,python,-m,procrastinate,--app=src.jobs.app.job_app,worker'
      - '--instances=1'
      - '--cpu=1'
      - '--memory=2Gi'
      - '--region=us-west1'
      - '--quiet'

  # 6. Deploy to Cloud Run. Request-based billing: the API does no work after a
  #    response ends (jobs run in the worker pool), so CPU can be throttled.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'talimio-backend'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--update-env-vars=MIGRATIONS_AUTO_APPLY=false'
      - '--cpu-throttling'
      - '--memory=4Gi'
      - '--quiet'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/talimio-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
